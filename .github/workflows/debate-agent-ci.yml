name: Debate Agent P1

on:
  push:
    paths:
      - "debate-agent/**"
      - ".github/workflows/debate-agent-ci.yml"
  pull_request:
    paths:
      - "debate-agent/**"
      - ".github/workflows/debate-agent-ci.yml"

jobs:
  contracts-and-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: debate_agent
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d debate_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend development dependencies
        run: python -m pip install -r debate-agent/backend/requirements-dev.txt
      - name: Run contract and shell tests
        working-directory: debate-agent
        run: python -m unittest discover -s backend/tests -v
      - name: Apply PostgreSQL migrations
        working-directory: debate-agent
        env:
          DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/debate_agent
        run: python -m alembic -c backend/alembic.ini upgrade head
