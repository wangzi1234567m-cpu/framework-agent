name: 基础测试

on:
  push:
  pull_request:

jobs:
  extract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装 PDF 测试依赖
        run: python -m pip install 'pymupdf>=1.24,<2'
      - name: 运行解析器单元测试
        run: python -m unittest discover -s backend/tests -v
